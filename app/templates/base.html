<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppEventos</title>
    <link rel="stylesheet" href="/static/style.css">

    <!-- PWA: identidade do app -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0078d4">

    <!-- Módulo offline carregado ANTES de qualquer script das telas -->
    <script src="/static/app.js"></script>
</head>
<body>
<div class="container">

<!-- Banner de aviso offline (exibido em todas as telas) -->
<div id="offline-banner" class="offline-banner">⚠️ Você está offline — os dados podem não estar atualizados.</div>

<script>
  // Detecção ATIVA de conectividade.
  // navigator.onLine não é confiável (adaptadores virtuais mantêm 'true'
  // mesmo com a placa de rede física desligada). Por isso testamos a
  // conectividade real com um recurso externo periodicamente.
  (function() {
    window.APP_OFFLINE = !navigator.onLine;

    function aplicarEstado(offline) {
      var mudou = window.APP_OFFLINE !== offline;
      window.APP_OFFLINE = offline;
      var banner = document.getElementById('offline-banner');
      if (banner) banner.classList.toggle('show', offline);
      if (mudou) {
        // Notifica o resto do app (ex.: sincronizar ao voltar online)
        window.dispatchEvent(new CustomEvent('app-connectivity', {
          detail: { offline: offline }
        }));
      }
    }

    function checarConexao() {
      if (!navigator.onLine) { aplicarEstado(true); return; }
      var ctrl = new AbortController();
      var t = setTimeout(function() { ctrl.abort(); }, 4000);
      fetch('https://www.gstatic.com/generate_204', {
        mode: 'no-cors', cache: 'no-store', signal: ctrl.signal
      }).then(function() {
        clearTimeout(t);
        aplicarEstado(false);
      }).catch(function() {
        clearTimeout(t);
        aplicarEstado(true);
      });
    }

    window.addEventListener('online',  checarConexao);
    window.addEventListener('offline', checarConexao);
    setInterval(checarConexao, 5000);
    checarConexao();
  })();
</script>

{% block content %}{% endblock %}
</div>

<!-- Compatibilidade: db.js e sync.js (código legado) -->
<script src="/static/db.js"></script>
<script src="/static/sync.js"></script>

<!-- PWA: registrar o Service Worker (com auto-atualização) -->
<script>
  if ('serviceWorker' in navigator) {
    let recarregando = false;
    // Quando um novo SW assume o controle, recarrega a página uma vez
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recarregando) return;
      recarregando = true;
      window.location.reload();
    });

    navigator.serviceWorker.register('/sw.js').then(reg => {
      console.log('SW registrado:', reg.scope);
      // Verifica atualização a cada carregamento
      reg.update();
      // Se houver um SW novo esperando, ativa imediatamente
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      reg.addEventListener('updatefound', () => {
        const novo = reg.installing;
        if (!novo) return;
        novo.addEventListener('statechange', () => {
          if (novo.state === 'installed' && navigator.serviceWorker.controller) {
            novo.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(e => console.error('SW falhou:', e));
  }
</script>
</body>
</html>
