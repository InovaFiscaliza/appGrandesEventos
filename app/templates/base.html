<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppEventos</title>
    <link rel="stylesheet" href="/static/style.css">

    <!-- PWA: identidade do app -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0078d4">

    <!-- Módulo offline carregado ANTES de qualquer script das telas -->
    <script src="/static/app.js"></script>
</head>
<body>
<div class="container">

<!-- Banner de aviso offline (exibido em todas as telas) -->
<div id="offline-banner" class="offline-banner">⚠️ Você está offline — os dados podem não estar atualizados.</div>

<script>
  // Verificação offline imediata (sem depender de app.js carregado)
  (function() {
    var banner = document.getElementById('offline-banner');
    if (banner) {
      banner.classList.toggle('show', !navigator.onLine);
    }
  })();
</script>

{% block content %}{% endblock %}
</div>

<!-- Compatibilidade: db.js e sync.js (código legado) -->
<script src="/static/db.js"></script>
<script src="/static/sync.js"></script>

<!-- PWA: registrar o Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(r => console.log('SW registrado:', r.scope))
      .catch(e => console.error('SW falhou:', e));
  }
</script>
</body>
</html>
