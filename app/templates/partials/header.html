<header class="app-header">
<div class="rf-topbar">
    <span class="rf-brand" aria-label="App Eventos">
        <img class="rf-brand-logo" src="/static/logoanatelwhite-transparent.png" alt="ANATEL">
        <span class="rf-topbar-context">App Eventos - Módulos</span>
    </span>
    {% if evento_nome %}
    <form id="evento-form" class="evento-switcher" method="post" action="/">
        <label for="evento-combo">Evento:</label>
        <select id="evento-combo" name="evento_key" data-evento-atual="{{ evento_nome }}" required>
            {% for nome, evento_id in request.state.eventos.items() %}
            <option value="{{ nome }}|||{{ evento_id }}" {% if nome == evento_nome %}selected{% endif %}>{{ nome }}</option>
            {% else %}
            <option value="">Nenhum evento disponível</option>
            {% endfor %}
        </select>
    </form>
    {% endif %}
</div>
</header>
