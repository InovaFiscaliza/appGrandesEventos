{% extends "base.html" %}
{% block content %}
{% include "partials/header.html" %}

{% if flash_success %}<div class="flash flash-success">{{ flash_success }}</div>{% endif %}
{% if flash_error %}<div class="flash flash-error">{{ flash_error }}</div>{% endif %}

<div class="form-card">
    <h5 style="margin-bottom:0.75rem">Registrar Jammer ou ERB Fake</h5>
    <form method="post" action="/bsr-erb">
        <div class="form-group">
            <label>Tipo <span class="required">*</span></label>
            <div class="radio-group">
                <label><input type="radio" name="tipo" value="BSR/Jammer" {% if tipo != "ERB Fake" %}checked{% endif %}> BSR/Jammer</label>
                <label><input type="radio" name="tipo" value="ERB Fake" {% if tipo == "ERB Fake" %}checked{% endif %}> ERB Fake</label>
            </div>
        </div>
        <div class="form-group">
            <label>Local <span class="required">*</span></label>
            <input type="text" name="regiao" value="{{ regiao or '' }}">
        </div>
        <div class="form-cols">
            <div class="form-group">
                <label>Latitude (-90 a 90)</label>
                <input type="text" inputmode="decimal" name="lat" value="{{ lat or '' }}"
                       placeholder="-23.550520"
                       pattern="^[+-]?\d+([.,]\d+)?$"
                       title="Número entre -90 e 90. Use ponto ou vírgula como decimal.">
            </div>
            <div class="form-group">
                <label>Longitude (-180 a 180)</label>
                <input type="text" inputmode="decimal" name="lon" value="{{ lon or '' }}"
                       placeholder="-46.633309"
                       pattern="^[+-]?\d+([.,]\d+)?$"
                       title="Número entre -180 e 180. Use ponto ou vírgula como decimal.">
            </div>
        </div>
        <button type="submit" class="btn btn-submit">Registrar</button>
    </form>
</div>

<div class="btn-col">
    <a href="/menu" class="btn btn-back">⬅️ Voltar ao Menu</a>
</div>
{% endblock %}
